<!-- The game's icon: the same emoji as its card on the dashboard, on a coloured tile. It's the browser tab's icon (the SVG, then
     a PNG drawn below) and the iPad home screen's (apple-touch-icon). The device's own emoji font draws it: no image files. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20x='2'%20y='2'%20width='60'%20height='60'%20rx='14'%20fill='%237ed957'%20stroke='%2314121f'%20stroke-width='4'/%3E%3Ctext%20x='32'%20y='44'%20font-size='36'%20text-anchor='middle'%3E%F0%9F%9A%B0%3C/text%3E%3C/svg%3E">
<script>
  (function (emoji, tile) {
    function draw(size, framed) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      if (!g) return '';
      const u = size / 64;
      g.fillStyle = tile;
      if (framed) { // the tab: a rounded tile with the dashboard's dark outline
        g.beginPath();
        if (g.roundRect) g.roundRect(2 * u, 2 * u, 60 * u, 60 * u, 14 * u); else g.rect(2 * u, 2 * u, 60 * u, 60 * u);
        g.fill();
        g.lineWidth = 4 * u;
        g.strokeStyle = '#14121f';
        g.stroke();
      } else g.fillRect(0, 0, size, size); // the home screen: iOS rounds the corners itself
      g.font = `${Math.round(size * (framed ? 0.56 : 0.62))}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
      g.textAlign = 'center';
      const m = g.measureText(emoji);
      const up = m.actualBoundingBoxAscent || size * 0.4, down = m.actualBoundingBoxDescent || 0;
      g.fillText(emoji, size / 2, size / 2 + (up - down) / 2);
      try { return c.toDataURL('image/png'); } catch (e) { return ''; }
    }
    const tab = draw(64, true), home = draw(180, false);
    if (tab) document.querySelector('link[rel="icon"]').href = tab;
    if (home) {
      const l = document.createElement('link');
      l.rel = 'apple-touch-icon';
      l.href = home;
      document.head.appendChild(l);
    }
  })('🚰', '#7ed957');
</script>

  /* ---------- HUD ---------- */

  /* your brother's button (1 player) / the high five (2 players): bottom right, big */

<body>
<canvas id="game"></canvas>
<canvas id="fx"></canvas>

<!-- home -->
<div id="home">
  <div class="logo" id="logo"><small></small><big></big></div>
  <div class="tagline">WATER THE FLOWERS!</div>
  <div class="tiles">
    <button class="tile puz" id="goPuzzles" title="Puzzles (1)" aria-label="Puzzles">
      <svg class="mini" viewBox="0 0 90 90" aria-hidden="true"><rect x="1" y="1" width="88" height="88" rx="10" fill="#6d4b2c"/><g fill="#fbefcf"><rect x="5" y="5" width="25" height="25" rx="4"/><rect x="32.5" y="5" width="25" height="25" rx="4"/><rect x="60" y="5" width="25" height="25" rx="4"/><rect x="5" y="32.5" width="25" height="25" rx="4"/><rect x="32.5" y="32.5" width="25" height="25" rx="4"/><rect x="60" y="32.5" width="25" height="25" rx="4"/><rect x="5" y="60" width="25" height="25" rx="4"/><rect x="32.5" y="60" width="25" height="25" rx="4"/><rect x="60" y="60" width="25" height="25" rx="4"/></g><path d="M45 17.5 H72.5" stroke="#b9c4d2" stroke-width="8" stroke-linecap="round"/><path d="M17.5 45 H45 V72.5 H72.5" fill="none" stroke="#23a0ff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="17.5" y="52" font-size="19" text-anchor="middle">🚰</text><text x="72.5" y="80" font-size="19" text-anchor="middle">🌷</text></svg>
      <b>PUZZLES</b><span class="prog" id="prog"></span><span class="go">▶</span>
    </button>
    <button class="tile race" id="goRace" title="Race (2)" aria-label="Race">
      <span class="minis"><svg class="mini" viewBox="0 0 90 90" aria-hidden="true"><rect x="1" y="1" width="88" height="88" rx="10" fill="#6d4b2c"/><g fill="#fbefcf"><rect x="5" y="5" width="25" height="25" rx="4"/><rect x="32.5" y="5" width="25" height="25" rx="4"/><rect x="60" y="5" width="25" height="25" rx="4"/><rect x="5" y="32.5" width="25" height="25" rx="4"/><rect x="32.5" y="32.5" width="25" height="25" rx="4"/><rect x="60" y="32.5" width="25" height="25" rx="4"/><rect x="5" y="60" width="25" height="25" rx="4"/><rect x="32.5" y="60" width="25" height="25" rx="4"/><rect x="60" y="60" width="25" height="25" rx="4"/></g><path d="M45 17.5 H72.5" stroke="#b9c4d2" stroke-width="8" stroke-linecap="round"/><path d="M17.5 45 H45 V72.5 H72.5" fill="none" stroke="#23a0ff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="17.5" y="52" font-size="19" text-anchor="middle">🚰</text><text x="72.5" y="80" font-size="19" text-anchor="middle">🌷</text></svg><svg class="mini" viewBox="0 0 90 90" aria-hidden="true"><rect x="1" y="1" width="88" height="88" rx="10" fill="#6d4b2c"/><g fill="#fbefcf"><rect x="5" y="5" width="25" height="25" rx="4"/><rect x="32.5" y="5" width="25" height="25" rx="4"/><rect x="60" y="5" width="25" height="25" rx="4"/><rect x="5" y="32.5" width="25" height="25" rx="4"/><rect x="32.5" y="32.5" width="25" height="25" rx="4"/><rect x="60" y="32.5" width="25" height="25" rx="4"/><rect x="5" y="60" width="25" height="25" rx="4"/><rect x="32.5" y="60" width="25" height="25" rx="4"/><rect x="60" y="60" width="25" height="25" rx="4"/></g><path d="M45 17.5 H72.5" stroke="#b9c4d2" stroke-width="8" stroke-linecap="round"/><path d="M17.5 45 H45 V72.5 H72.5" fill="none" stroke="#23a0ff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="17.5" y="52" font-size="19" text-anchor="middle">🚰</text><text x="72.5" y="80" font-size="19" text-anchor="middle">🌷</text></svg></span>
      <b>RACE</b><span class="go">▶</span>
    </button>
  </div>
  <div class="opts">
    <div class="seg" id="segPlayers" role="radiogroup" aria-label="Players">
      <button data-v="1"><span class="emo">👤</span>1 PLAYER</button>
      <button data-v="2"><span class="emo">👥</span>2 PLAYERS</button>
    </div>
    <div class="seg" id="segWho" role="radiogroup" aria-label="Who are you?">
      <button data-v="teddy"><img alt="" draggable="false">TEDDY</button>
      <button data-v="tommy"><img alt="" draggable="false">TOMMY</button>
    </div>
    <div class="seg" id="segLevel" role="radiogroup" aria-label="Level">
      <button data-v="easy"><span class="emo">🐣</span>EASY</button>
      <button data-v="normal"><span class="emo">🔥</span>NORMAL</button>
    </div>
  </div>
</div>

<!-- the level picker -->
<div id="levels" class="hidden">
  <div class="lvhead">
    <img id="lvFace" alt="" draggable="false">
    <div class="seg" id="lvTier" role="radiogroup" aria-label="Level">
      <button data-v="easy"><span class="emo">🐣</span>EASY</button>
      <button data-v="normal"><span class="emo">🔥</span>NORMAL</button>
    </div>
    <div class="pill stars">⭐ <b id="lvStars">0</b></div>
  </div>
  <div class="lvgrid" id="lvGrid"></div>
  <div class="lvback"><button class="bigbtn" id="lvHome" aria-label="Home">🏠</button></div>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="hudtop">
    <button class="ibtn" id="pauseBtn" title="Pause (P)" aria-label="Pause">⏸️</button>
    <div class="hudmid">
      <div class="pill lvl" id="lvlPill"><span id="lvlName"></span> <b id="flowers"></b></div>
      <div class="pill" id="tapsPill"><span>TAPS</span> <b id="taps">0</b> <span class="goal">⭐⭐⭐</span> <b class="goal" id="goal">0</b></div>
      <div class="race" id="raceBar"><span id="raceA"></span><span class="dots" id="dotsA"></span><span class="vs">VS</span><span class="dots" id="dotsB"></span><span id="raceB"></span></div>
    </div>
    <div class="hudright">
      <button class="ibtn" id="restartBtn" title="Start again (R)" aria-label="Start again">🔄</button>
      <button class="ibtn" id="muteBtn" title="Sound (M)" aria-label="Sound on or off">🔊</button>
    </div>
  </div>
</div>
<div class="tag hidden" id="tag0"><div class="pill"></div></div>
<div class="tag hidden" id="tag1"><div class="pill"></div></div>
<button class="callbtn hidden" id="callBtn" aria-label="Call your brother"><img id="callFace" alt=""><kbd>T</kbd></button>

<div id="toasts"></div>
<div id="count" class="hidden"></div>

<!-- every flower has water -->
<div id="winPanel" class="overlay hidden">
  <div class="panel">
    <div class="rface" id="wFace"></div>
    <div class="rtitle" id="wTitle"></div>
    <div class="rstars" id="wStars"><i>⭐</i><i>⭐</i><i>⭐</i></div>
    <div class="rinfo" id="wInfo"></div>
    <div class="rbtns">
      <button class="bigbtn go" id="wNext" aria-label="Next level">▶</button>
      <button class="bigbtn" id="wAgain" aria-label="Play again"><span class="word">PLAY AGAIN</span></button>
      <button class="bigbtn" id="wLevels" aria-label="Levels">🔢</button>
      <button class="bigbtn" id="wHome" aria-label="Home">🏠</button>
    </div>
  </div>
</div>

<!-- a race round is over / the race is over -->
<div id="raceOver" class="overlay hidden">
  <div class="panel">
    <div class="rface" id="rFace"></div>
    <div class="rtitle" id="rTitle"></div>
    <div class="rscore" id="rScore"></div>
    <div class="rbtns">
      <button class="bigbtn go" id="rNext" aria-label="Next round">▶</button>
      <button class="bigbtn go" id="rAgain" aria-label="Play again"><span class="word">PLAY AGAIN</span></button>
      <button class="bigbtn" id="rHome" aria-label="Home">🏠</button>
    </div>
  </div>
</div>

<!-- pause -->
<div id="pause" class="overlay hidden">
  <div class="panel">
    <button class="bigbtn go" id="pResume" aria-label="Keep playing">▶</button>
    <button class="bigbtn" id="pRestart" aria-label="Start again">🔄</button>
    <button class="bigbtn" id="pLevels" aria-label="Levels">🔢</button>
    <button class="bigbtn" id="pHome" aria-label="Home">🏠</button>
  </div>
</div>

<div id="loading"><span>🚰</span></div>
